<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TraceGuard 视频内容安全风控平台交互原型，覆盖风险大盘、告警复核、主体计分卡和规则模拟。"><title>TraceGuard · 交互原型</title><style>
  :root{
    /* 调色板（dataviz 校验通过） */
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
    --seq-100:#cde2fb;
    --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
    --delta-good:#006300; --delta-bad:#b30f0f;
    --st-l1:#2a78d6; --st-l2:#fab219; --st-l3:#ec835a; --st-l4:#d03b3b;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page);color:var(--ink);
       font:14px/1.6 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
  /* ── 顶栏 ── */
  header{position:sticky;top:0;z-index:9;background:var(--surface-1);border-bottom:1px solid var(--grid);
         display:flex;align-items:center;gap:20px;padding:0 24px;height:54px;}
  .logo{font-weight:700;font-size:15px;letter-spacing:.2px;}
  .logo .en{color:var(--ink-3);font-weight:400;margin-left:6px;}
  .proto-tag{background:#eef4fc;color:#1c5cab;font-size:11.5px;border-radius:999px;padding:1px 10px;}
  nav{display:flex;gap:2px;margin-left:8px;}
  nav button{border:none;background:none;font:inherit;color:var(--ink-2);padding:6px 13px;border-radius:7px;cursor:pointer;}
  nav button:hover{background:#f0f0ec;}
  nav button.on{background:#0b0b0b;color:#fff;}
  .hd-right{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--ink-2);font-size:12.5px;}
  select.fake,input.fake{font:inherit;font-size:12.5px;color:var(--ink-2);background:var(--surface-1);
       border:1px solid var(--grid);border-radius:7px;padding:4px 10px;}
  main{max-width:1240px;margin:0 auto;padding:20px 24px 60px;}
  .page{display:none;} .page.on{display:block;}
  h2.pt{font-size:17px;margin:4px 0 2px;}
  .psub{color:var(--ink-3);font-size:12.5px;margin:0 0 14px;}
  /* ── 通用卡片/表格 ── */
  .card{background:var(--surface-1);border:1px solid var(--ring);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .card h3{font-size:13.5px;margin:0 0 10px;color:var(--ink);}
  .card .cap{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:6px;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th,td{border-bottom:1px solid var(--grid);padding:8px 10px;text-align:left;vertical-align:top;}
  th{color:var(--ink-2);font-weight:600;background:#f6f6f3;}
  td.num,th.num{font-variant-numeric:tabular-nums;text-align:right;}
  tr.click{cursor:pointer;} tr.click:hover td{background:#f6f9fd;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--ink-2);}
  /* ── 状态标签（图标+文字，绝不只靠颜色） ── */
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:999px;padding:1px 9px;white-space:nowrap;}
  .tag .ic{width:8px;height:8px;border-radius:2px;flex:none;}
  .t-l1{background:rgba(42,120,214,.10);} .t-l1 .ic{background:var(--st-l1);}
  .t-l2{background:rgba(250,178,25,.14);} .t-l2 .ic{background:var(--st-l2);}
  .t-l3{background:rgba(236,131,90,.13);} .t-l3 .ic{background:var(--st-l3);}
  .t-l4{background:rgba(208,59,59,.10);}  .t-l4 .ic{background:var(--st-l4);}
  .t-black{background:rgba(11,11,11,.07);} .t-black .ic{background:var(--ink);}
  .t-white{background:rgba(12,163,12,.10);} .t-white .ic{background:var(--st-good);}
  .t-gray{background:rgba(11,11,11,.06);color:var(--ink-2);}
  .t-blue{background:#eef4fc;color:#1c5cab;} .t-blue .ic{background:var(--series-1);}
  /* ── 按钮 ── */
  .btn{font:inherit;font-size:12.5px;border-radius:8px;padding:5px 14px;cursor:pointer;border:1px solid var(--grid);background:var(--surface-1);color:var(--ink);}
  .btn:hover{background:#f0f0ec;}
  .btn.pri{background:#0b0b0b;border-color:#0b0b0b;color:#fff;}
  .btn.pri:hover{background:#2b2b28;}
  .btn.warn{border-color:rgba(208,59,59,.4);color:#b30f0f;}
  /* ── stat tile ── */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .tile{background:var(--surface-1);border:1px solid var(--ring);border-radius:12px;padding:14px 16px;}
  .tile .lb{font-size:12px;color:var(--ink-2);}
  .tile .vl{font-size:26px;font-weight:600;margin:2px 0 0;}
  .tile .dt{font-size:11.5px;margin-top:2px;}
  .up-bad{color:var(--delta-bad);} .dn-good{color:var(--delta-good);}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start;}
  .grid22{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  /* ── 横条图（div 实现，2px 表面缝隙，直接标注） ── */
  .hrow{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:10px;margin:7px 0;}
  .hrow .nm{font-size:12px;color:var(--ink-2);text-align:right;display:flex;justify-content:flex-end;gap:6px;align-items:center;}
  .hrow .nm .ic{width:8px;height:8px;border-radius:2px;flex:none;}
  .track{position:relative;height:18px;background:#f3f3ef;border-radius:4px;overflow:hidden;}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px 4px 4px 4px;}
  .hrow .vv{font-size:12px;font-variant-numeric:tabular-nums;}
  /* 堆叠贡献条 */
  .stack{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface-1);}
  .stack div{height:100%;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px;font-size:11.5px;color:var(--ink-2);}
  .legend .ic{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
  /* ── 时间线 ── */
  .tl{list-style:none;margin:0;padding:0 0 0 4px;}
  .tl li{position:relative;padding:0 0 13px 20px;border-left:2px solid var(--grid);margin-left:6px;}
  .tl li:last-child{border-left-color:transparent;padding-bottom:2px;}
  .tl .dot{position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface-1);}
  .tl .tm{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .tl .tt{font-size:12.5px;}
  .tl .meta{font-size:11.5px;color:var(--ink-3);}
  /* 分片覆盖条 */
  .segs{display:flex;flex-wrap:wrap;gap:2px;margin:8px 0 4px;}
  .segs i{width:10px;height:14px;border-radius:2px;background:var(--series-1);}
  .segs i.m{background:var(--seq-100);}
  /* 表单行 */
  .frow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12.5px;}
  .frow label{width:110px;color:var(--ink-2);text-align:right;flex:none;}
  .cond{border:1px solid var(--grid);border-radius:9px;padding:10px 12px;margin:8px 0;background:#fbfbf9;}
  .cond .chd{font-size:11px;color:var(--ink-3);letter-spacing:.4px;margin-bottom:6px;}
  pre.code{background:#f4f4f0;border:1px solid var(--grid);border-radius:9px;padding:12px 14px;font:11.5px/1.7 ui-monospace,Menlo,Consolas,monospace;color:var(--ink-2);overflow-x:auto;margin:0;}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:12.5px;margin:0;}
  .kv dt{color:var(--ink-3);} .kv dd{margin:0;}
  .note{font-size:11.5px;color:var(--ink-3);background:#f6f6f3;border-radius:8px;padding:8px 12px;margin-top:10px;}
  .footer-note{margin-top:26px;color:var(--ink-3);font-size:11.5px;text-align:center;}

<body><header><div class="logo"><span class="brand-icon">T</span><div>TraceGuard<small>视频内容安全风控平台</small></div></div><nav id="nav" aria-label="主导航"><button data-page="dash" class="on">风险大盘</button><button data-page="alerts">告警中心</button><button data-page="scorecards">计分卡</button><button data-page="editor">规则编辑器</button></nav><div class="hd-right"><select id="tenant" class="filter" aria-label="租户视角"><option value="all">全部租户</option><option value="A">租户 A · 教育学院</option><option value="B">租户 B · 职业培训</option></select><span class="user-name">风控运营</span><span class="avatar" aria-label="演示用户林岚">林</span></div></header><div class="demo-band"><span class="demo-dot"></span><span>交互演示 · 虚构数据</span><span class="extra">｜计分卡 v0.2 候选口径，分数不代表盗版概率</span><button data-act="guide">演示指南 ↗</button><button data-act="reset" style="margin-left:5px">重置演示</button></div><div id="storage-warning" hidden class="storage-warning">当前浏览器无法保存本地状态，本次交互仍可使用。</div><main><div class="breadcrumb" id="breadcrumb"></div><div id="app"></div><div class="footer"><span>TraceGuard · 内容安全运营工作台</span><span>原型 v0.3 · 本地演示配置 · 2026.10.23</span></div></main><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="detail" class="drawer" aria-label="告警详情"></dialog><dialog id="modal" aria-label="操作面板"></dialog><script>'use strict';
const GROUPS = {R1:0,R4A:0,R2:1,R6:1,R8:1,R3:2,R4B:2,R5:2,R10:3,R7:4};
const MAIN = new Set(['R1','R2','R3','R4A','R4B','R7']);
function level(score) {
  if (score === null || score === undefined) return '数据不足';
  return score >= 50 ? '高危险' : score >= 25 ? '注意' : score > 0 ? '一般' : '无计分命中';
}
function calculate(facts, options = {}) {
  function deduplicate(items) {
    const byFact = new Map();
    items.filter(f => f.score > 0 && GROUPS[f.rule] !== undefined).forEach(f => {
      const key = f.fact || f.rule;
      const prev = byFact.get(key);
      if (!prev || prev.score < f.score || (prev.score === f.score && MAIN.has(f.rule))) byFact.set(key, f);
    });
    return [...byFact.values()];
  }
  const unique = deduplicate(facts);
  function sum(items) {
    const highest = new Map();
    items.forEach(f => { if (!highest.has(f.rule) || highest.get(f.rule).score < f.score) highest.set(f.rule,f); });
    const group = [0,0,0,0,0];
    highest.forEach(f => { group[GROUPS[f.rule]] += f.score; });
    const capped = group.map((n,i) => Math.min(n,[60,60,60,15,50][i]));
    const repeats = Math.max(1,...items.filter(f => MAIN.has(f.rule)).map(f => f.repeat || 1));
    const bonus = Math.min(15,Math.max(0,(repeats - 1)*5));
    return {score:Math.min(100,capped.reduce((a,b) => a+b,0)+bonus),group:capped,bonus};
  }
  const anomaly = sum(unique);
  const eligible = facts.filter(f => f.score > 0 && GROUPS[f.rule] !== undefined && f.eligible !== false && f.rule !== 'R7');
  const mainContexts = new Set(eligible.filter(f => MAIN.has(f.rule)).map(f => f.context || 'default'));
  const suspicion = sum(deduplicate(eligible.filter(f => MAIN.has(f.rule) || mainContexts.has(f.context || 'default'))));
  const unavailable = options.available === false;
  return {anomaly:unavailable ? null : anomaly.score,suspicion:unavailable || options.attribution === false ? null : suspicion.score,groups:{anomaly:anomaly.group,suspicion:suspicion.group},bonus:{anomaly:anomaly.bonus,suspicion:suspicion.bonus}};
}
if (typeof module !== 'undefined') module.exports = {calculate,level};

}
function render() {
  document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('on',b.dataset.page===state.page);b.setAttribute('aria-current',b.dataset.page===state.page?'page':'false');});
  $('#breadcrumb').textContent=`安全运营工作台　 /　${names[state.page]}`;
  $('#app').innerHTML=({dash:overview,alerts:alertsPage,scorecards:scorecardsPage,editor:editorPage})[state.page]();
}
function selectRule(id) {
  state.editor=id;draft=clone(ruleById(id));tested=false;go('editor');
}
function markUntested() {
  tested=false;
  if ($('#save-rule')) $('#save-rule').disabled=true;
  if ($('#test-result')) $('#test-result').hidden=true;
  if ($('#expr-preview')) $('#expr-preview').textContent=previewExpression();
  if ($('#draft-status')) $('#draft-status').textContent='草稿已修改 · 请重新校验与回放';
}
function validateDraft() {
  const errors=[];
  if (!draft.name.trim()) errors.push('请填写规则名称。');
  let previous=-1;
  draft.tiers.forEach(t=>{
    if (!Number.isFinite(Number(t.score))||t.score<0||t.score>100) errors.push(`${t.name}档分值须在 0–100 之间。`);
    if (t.score<previous) errors.push('高档分值不能小于低档分值。');
    previous=t.score;
    if (draft.kind==='标签'&&Number(t.score)!==0) errors.push('R9 是上下文标签，分值固定为 0。');
    if (!t.conditions.length||t.conditions.some(c=>!FIELDS[c.field]||!Number.isFinite(Number(c.value)))) errors.push(`${t.name}档存在不完整条件。`);
  });
  return [...new Set(errors)];
}
function runRuleTest() {
  const errors=validateDraft();
  const featureInputs=[...document.querySelectorAll('[data-feature]')];
  if (featureInputs.some(input=>input.value===''||!Number.isFinite(Number(input.value)))) errors.push('请填写有效的样例特征值。');
  const features=Object.fromEntries(featureInputs.map(input=>[input.dataset.feature,Number(input.value)]));
  const result=evaluate(draft,features);
  const panel=$('#test-result');panel.hidden=false;panel.classList.toggle('error-panel',errors.length>0);
  panel.innerHTML=errors.length?errors.map(esc).join('<br>'):`<strong>${draft.enabled?`回放完成 · ${esc(result.tier)}`:'回放完成 · 规则已停用'}</strong><br>本规则贡献 <b style="font-size:24px">${result.score}</b> 分 ${draft.kind==='标签'?'· 仅保留标签':''}<br><span class="small">这是单规则档位分，主体总分还需准入、去重与分组封顶。</span>`;
  tested=errors.length===0;$('#save-rule').disabled=!tested;
}
function openModal(title,body,footer='') {
  const modal=$('#modal');if(modal.open)modal.close();
  modal.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button class="btn icon right" data-act="close-modal" aria-label="关闭弹窗">×</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-foot">${footer}</div>`:''}`;
  modal.showModal();
}
function openAlert(id,tab='overview') {
  const a=alerts.find(a=>a.id===id);if(!a)return;
  state.selectedAlert=id;state.detailTab=tab;const c=getCase(a);
  const tabs=`<div class="tabs"><button data-act="detail-overview" class="${tab==='overview'?'on':''}">风险解释</button><button data-act="detail-log" class="${tab==='log'?'on':''}">复核记录 ${a.logs.length?`(${a.logs.length})`:''}</button></div>`;
  const overview=`<div class="score-boxes">${scoreBox(a.snapshot.anomaly,'异常分 A')}${scoreBox(a.snapshot.suspicion,'盗版嫌疑分 S',a.snapshot.suspicion===null?'缺少可算依据或主体身份待核实':'触发时评分快照')}</div><div class="badges" style="margin-bottom:20px">${badge(c.evidence,c.evidence==='特征已核实'?'good':'neutral')}${badge(a.status,'info')}${badge('计分卡 '+a.ruleVersion)}</div><div class="card"><h3>主体与归因</h3><dl class="meta-list" style="margin-top:16px"><dt>主体</dt><dd>${esc(c.entity)} · ${subjectNames[c.subject]}</dd><dt>归属租户</dt><dd>租户 ${c.tenant}</dd><dt>嫌疑方向</dt><dd>${esc(c.direction)}</dd><dt>身份依据</dt><dd>${esc(c.identity)}</dd><dt>关联视频</dt><dd>${esc(c.video)}</dd></dl>${c.relatedCredentialScore?`<div class="note">关联凭证风险 ${c.relatedCredentialScore} 分，不能复制到本人行为评分。</div>`:''}</div><div class="card"><div class="card-head"><h3>命中事实</h3><span class="sub">触发时证据</span></div>${c.facts.length?c.facts.map(f=>`<div style="padding:10px 0;border-bottom:1px solid var(--grid)"><div class="row"><span class="rule-chip">${f.rule}</span><b>${esc(RULES.find(r=>r.id===f.rule).name)}</b><span class="right score">${f.score} 分</span></div><div class="inline-note">${esc(f.fact)}</div></div>`).join(''):'<p class="inline-note">暂无可归属到当前主体的计分事实。</p>'}<div class="metric-note">同事实去重，分组封顶；不直接累加明细分值。R7 仅计异常分，不进入嫌疑分。</div></div>${c.missing.length?`<div class="notice"><div><strong>尚未满足的条件</strong><br>${c.missing.map(esc).join('<br>')}</div></div>`:''}<div class="row">${c.subject==='token'?'':'<button class="btn" data-act="detail-scorecard">查看主体计分卡 →</button>'}<button class="btn quiet" data-act="detail-log">查看复核记录</button></div>`;
  const log=`<ul class="timeline"><li>告警生成 · ${a.ruleVersion} 评分快照<small>${esc(a.time)} · 系统（演示）</small></li>${a.logs.map(l=>`<li><b>${esc(l.status)}</b> · ${esc(l.note)}<small>${esc(l.time)} · ${esc(l.owner)}</small></li>`).join('')}</ul>${a.logs.length?'':'<div class="note">尚无人工复核操作。本页面的所有操作仅更新本地演示状态。</div>'}`;
  const d=$('#detail');
  d.innerHTML=`<div class="dialog-head"><div><div class="small muted">告警详情 · ${timeText(a.time)}</div><h2>${esc(a.id)}</h2></div><button class="btn icon right" data-act="close-detail" aria-label="关闭告警详情">×</button></div><div class="dialog-body">${tabs}${tab==='overview'?overview:log}</div><div class="dialog-foot" style="position:sticky;bottom:0;background:#fff"><button class="btn" data-review="观察中">挂起观察</button><button class="btn" data-review="已误报">标记误报</button><button class="btn" data-review="复核中">开始复核</button><button class="btn pri" data-review="已确认">确认风险</button></div>`;
  if(!d.open)d.showModal();
}
function reviewAlert(status) {
  openModal('复核操作 · '+status,`<div class="notice">仅更新当前告警的人工复核状态。特征核实状态和历史评分保持独立。</div><div class="field"><label for="review-note">复核依据 <span style="color:var(--red)">*</span></label><textarea id="review-note" class="input" maxlength="300" placeholder="请说明判断依据或待补数据，例如已核对合法批量下载授权。" required></textarea></div><p id="review-error" class="small" style="color:var(--red)" hidden>请填写复核依据。</p>`,`<button class="btn" data-act="close-modal">取消</button><button class="btn pri" data-confirm-review="${status}">保存复核结论</button>`);
}
function downloadResults() {
  const rows=[['告警编号','主体','主体类型','异常分A','嫌疑分S','证据状态','复核状态','时间'],...filteredAlerts().map(a=>{const c=getCase(a);return [a.id,c.entity,subjectNames[c.subject],scoreText(a.snapshot.anomaly),scoreText(a.snapshot.suspicion),c.evidence,a.status,a.time];})];
  const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const link=document.createElement('a');link.href=url;link.download='TraceGuard-演示告警.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出当前筛选结果（演示数据）');
}
function showHistory() {
  openModal('演示版本记录',`<div class="notice">规则版本影响后续样例模拟；已有告警保持触发时的评分快照。</div>${versions.map(v=>`<div class="version-row"><b>${esc(v.version)}</b>　${esc(v.rule)} · ${esc(v.name)}<div class="small muted">${esc(v.time)} · 本浏览器演示配置</div></div>`).join('')}<div class="version-row"><b>v0.2</b>　基准计分卡讨论稿<div class="small muted">双分、同事实去重、证据组限额 · 候选阈值</div></div>`);
}
function showGuide() {
  openModal('演示指南',`<p class="inline-note">四个工作台围绕同一组虚构样例联动。可按以下顺序点击体验：</p>${[['dash','发现风险','切换时间与租户，点击指标或趋势下钻。'],['alerts','复核告警','搜索主体，查看 A / S 双分与证据状态，填写复核依据。'],['scorecards','解释评分','切换个人、视频，查看事实准入与分组封顶。'],['editor','调整候选规则','编辑条件、运行样例回放、保存演示版本，再返回计分卡。']].map(([page,title,description],i)=>`<button class="intro-step" data-guide-page="${page}"><i>${i+1}</i><span><strong>${title} →</strong><small>${description}</small></span></button>`).join('')}<p class="inline-note">本地状态会在本浏览器保留，可随时重置。所有数据、回放和复核均为演示。</p>`);
}
function timestamp() { const t=Math.max(Date.now(),Date.parse('2026-10-23T10:00:00+08:00')); return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'short'}).format(new Date(t)); }
document.addEventListener('click',event=>{
  const b=event.target.closest('button,[data-act][role="button"]');if(!b||b.disabled)return;
  if(b.dataset.page){go(b.dataset.page);return;}
  if(b.dataset.guidePage){$('#modal').close();go(b.dataset.guidePage);return;}
  if(b.dataset.alert){openAlert(b.dataset.alert);return;}
  if(b.dataset.rule){selectRule(b.dataset.rule);return;}
  if(b.dataset.review){reviewAlert(b.dataset.review);return;}
  if(b.dataset.confirmReview){
    const note=$('#review-note').value.trim();if(!note){$('#review-error').hidden=false;$('#review-note').focus();return;}
    const a=alerts.find(a=>a.id===state.selectedAlert);a.status=b.dataset.confirmReview;a.note=note;a.owner='林岚';a.logs.push({status:a.status,note,time:timestamp(),owner:'林岚'});persist();$('#modal').close();render();openAlert(a.id,'log');toast('复核结论已保存，列表与大盘已同步');return;
  }
  if(b.dataset.add!==undefined){draft.tiers[Number(b.dataset.add)].conditions.push({field:'speed_ratio',op:'>=',value:1});tested=false;render();return;}
  if(b.dataset.remove){const [ti,ci]=b.dataset.remove.split(':').map(Number);draft.tiers[ti].conditions.splice(ci,1);tested=false;render();return;}
  switch(b.dataset.act){
    case 'range':state.days=Number(b.dataset.value);state.pageIndex=1;state.day='';render();break;
    case 'all-alerts':jumpAlerts();break;
    case 'pending':jumpAlerts({status:'pending'});break;
    case 'high':jumpAlerts({severity:'high'});break;
    case 'insufficient':jumpAlerts({severity:'missing',subject:'all'});break;
    case 'severity':jumpAlerts({severity:b.dataset.value});break;
    case 'chart-day':jumpAlerts({day:b.dataset.value});break;
    case 'refresh':render();toast('演示数据已刷新 · 当前操作状态已保留');break;
    case 'clear-filters':Object.assign(state,{severity:'all',status:'all',subject:'all',query:'',day:'',pageIndex:1});render();break;
    case 'clear-day':state.day='';render();break;
    case 'prev-page':state.pageIndex--;render();break;
    case 'next-page':state.pageIndex++;render();break;
    case 'page-number':state.pageIndex=Number(b.dataset.value);render();break;
    case 'export':downloadResults();break;
    case 'score-subject':state.scoreSubject=b.dataset.value;state.caseId='';render();break;
    case 'all-tenants':state.tenant='all';$('#tenant').value='all';render();break;
    case 'simulate-card':render();toast('计分模拟完成 · 已按当前演示配置重算');break;
    case 'discard-draft':draft=clone(ruleById(draft.id));tested=false;render();toast('已还原为当前已保存的规则');break;
    case 'validate-rule':{const errors=validateDraft();openModal(errors.length?'配置需要调整':'配置校验通过',errors.length?`<p>${errors.map(esc).join('<br>')}</p>`:'<p>条件和分值格式有效。请运行样例回放，检查档位命中与业务前提，再保存演示版本。</p>');break;}
    case 'test-rule':runRuleTest();break;
    case 'save-rule':{
      if(!tested||validateDraft().length)return;
      const index=rules.findIndex(r=>r.id===draft.id);rules[index]=clone(draft);const version='v0.2.'+(versions.length+1);versions.unshift({version,rule:draft.id,name:draft.name,time:timestamp()});persist();tested=false;render();toast(`已保存 ${version} · 历史告警评分未改写`);break;}
    case 'close-modal':$('#modal').close();break;
    case 'close-detail':$('#detail').close();break;
    case 'detail-overview':openAlert(state.selectedAlert);break;
    case 'detail-log':openAlert(state.selectedAlert,'log');break;
    case 'detail-scorecard':{const c=getCase(alerts.find(a=>a.id===state.selectedAlert));state.scoreSubject=c.subject;state.caseId=c.id;state.attribution=c.attribution;$('#detail').close();go('scorecards');break;}
    case 'guide':showGuide();break;
    case 'history':showHistory();break;
    case 'reset':openModal('重置演示',`<p>恢复初始虚构数据、复核状态与规则配置，清除本浏览器保存的演示版本。</p>`,`<button class="btn" data-act="close-modal">取消</button><button class="btn pri" data-act="confirm-reset">重置演示</button>`);break;
    case 'confirm-reset':{
      try{localStorage.removeItem(storeKey);}catch{/* 无存储时仍恢复内存中的初始数据。 */}
      rules.splice(0,rules.length,...clone(RULES));alerts.splice(0,alerts.length,...freshAlerts());versions.splice(0);
      Object.assign(state,{tenant:'all',days:7,severity:'all',status:'all',subject:'all',query:'',day:'',pageIndex:1,scoreSubject:'person',caseId:CASES[0].id,attribution:true,editor:'R2',selectedAlert:null});
      draft=clone(ruleById('R2'));tested=false;$('#tenant').value='all';$('#modal').close();if($('#detail').open)$('#detail').close();go('dash');toast('已恢复初始演示数据与规则配置');break;}

  }
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.id==='search'){state.query=el.value;state.pageIndex=1;$('#alert-results').innerHTML=alertResults();return;}
  if(el.id==='rule-name'){draft.name=el.value;markUntested();return;}
  if(el.dataset.tierScore!==undefined){draft.tiers[Number(el.dataset.tierScore)].score=el.value===''?NaN:Number(el.value);markUntested();return;}
  if(el.dataset.cond){const [ti,ci,field]=el.dataset.cond.split(':');draft.tiers[Number(ti)].conditions[Number(ci)][field]=field==='value'?(el.value===''?NaN:Number(el.value)):el.value;markUntested();return;}
  if(el.dataset.feature)markUntested();
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.id==='tenant'){state.tenant=el.value;state.pageIndex=1;state.caseId='';render();return;}
  const filterKey={'severity-filter':'severity','status-filter':'status','subject-filter':'subject'}[el.id];
  if(filterKey){state[filterKey]=el.value;state.pageIndex=1;render();return;}
  if(el.id==='case-select'){state.caseId=el.value;state.attribution=CASES.find(c=>c.id===el.value).attribution;render();return;}
  if(el.id==='attribution'){state.attribution=el.checked;render();return;}
  if(el.id==='rule-enabled'){draft.enabled=el.checked;markUntested();return;}
  if(el.dataset.tierLogic!==undefined){draft.tiers[Number(el.dataset.tierLogic)].logic=el.value;markUntested();return;}
  if(el.dataset.cond?.endsWith(':field')){ $('#test-features').innerHTML=editorFeatures(); }
});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-act][role="button"]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(names[page]){state.page=page;render();}});
if(names[location.hash.slice(1)])state.page=location.hash.slice(1);
render();
</script></body></html>
